[project]
name = "scholar-studio-rag"
version = "0.1.0"
description = "RAG-Based Intelligent Quiz Generation and Source-Grounded Learning System"
authors = [{ name = "Mohamed Hasim", email = "hasim@example.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "openai>=1.50.0",
    "python-multipart>=0.0.12",
    "pymupdf>=1.24.10",
    "pypdf>=5.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "numpy>=1.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
